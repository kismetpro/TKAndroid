name: Android Build

on:
  workflow_dispatch: # 手动触发打包

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 允许将 APK 提交回仓库

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 核心修复：不依赖 gradlew (因为无法生成二进制 jar 包)，直接运行系统预装的 gradle
      - name: Build with Gradle
        run: gradle assembleDebug

      - name: Find and Prepare APK
        run: |
          mkdir -p build_output
          # 动态查找 APK，避免路径差异问题
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "错误：未发现生成的 APK 文件。"
            exit 1
          fi
          cp "$APK_FILE" ./TK_Medicine_App.apk
          echo "APK 准备就绪：TK_Medicine_App.apk"

      - name: Commit and Push APK
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add TK_Medicine_App.apk
          git commit -m "chore: 自动化构建输出 APK [skip ci]" || echo "无改动可提交"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
